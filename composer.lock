                            "package": "symfony/process",
                            "versions": "^6.4 || ^7.0 || ^8.0",
                            "file": "Process.php",
                            "why": "A Process built without a timeout - the core's own, new Process([...]) in CacheClearTrait, IntegritySubscriber and WebpackTagRenderer, and any other - waits SYMFONY_PROCESS_TIMEOUT seconds (a site sets it to its PHP max execution time), 60 when it is not set: Process's default 60 becomes null, read from the environment in the constructor.",
                            "do": [
                                {
                                    "default": "null",
                                    "of": [
                                        "Symfony\\Component\\Process\\Process::__construct($timeout)",
                                        "Symfony\\Component\\Process\\Process::fromShellCommandline($timeout)"
                                    ]
                                },
                                {
                                    "prepend": "$timeout ??= $_ENV['SYMFONY_PROCESS_TIMEOUT'] ?? 60;",
                                    "before": "$this->setTimeout($timeout);",
                                    "count": 1
                                }
                            ]
